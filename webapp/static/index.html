<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic IDE</title>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #11161f;
    --surface-2: #161c28;
    --border: #202938;
    --border-soft: #1a2230;
    --text: #e4e8f1;
    --text-muted: #8a94a6;
    --text-dim: #5c6678;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-soft: rgba(99, 102, 241, 0.12);
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --mono: "Cascadia Code", "Fira Code", Consolas, "JetBrains Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Scrollbar ───────────────────────────── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3850; }

  /* ── Header ──────────────────────────────── */
  header {
    height: 54px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #10141d 0%, #0d1017 100%);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.2px;
  }
  .logo-badge {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
  }

  .status-pill {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
  }

  .header-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #1c2433; border-color: #2c3850; }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
  }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-spin {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Layout ──────────────────────────────── */
  .main { flex: 1; display: flex; min-height: 0; }

  /* ── Sidebar ─────────────────────────────── */
  aside {
    width: 264px;
    min-width: 264px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width 0.2s ease;
  }
  .tabs {
    display: flex; gap: 2px;
    padding: 8px 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 8px 0 9px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .side-content { flex: 1; overflow-y: auto; padding: 10px; }
  .side-empty { color: var(--text-dim); font-size: 12.5px; padding: 14px 8px; text-align: center; }

  /* File tree */
  .folder { font-size: 12.5px; }
  .folder-item {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .folder-item:hover { background: var(--surface-2); color: var(--text); }
  .folder-item.is-dir { color: var(--text); font-weight: 500; }
  .folder-item.selected { background: var(--accent-soft); color: var(--accent); }
  .children { margin-left: 14px; }

  /* Sessions */
  .session-item {
    padding: 9px 10px;
    border: 1px solid var(--border-soft);
    border-radius: 9px;
    margin-bottom: 7px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .session-item:hover { border-color: var(--accent); background: var(--surface-2); }
  .session-item .s-title { font-size: 12.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .s-meta { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .session-loading { opacity: 0.5; }

  /* ── Chat ────────────────────────────────── */
  section.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }

  .chat-scroll { flex: 1; overflow-y: auto; padding: 26px 0 14px; }
  .chat-inner { max-width: 780px; margin: 0 auto; padding: 0 22px; }

  .msg { display: flex; margin-bottom: 20px; animation: fadeUp 0.22s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 9px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    margin-right: 11px;
  }
  .avatar.user { background: linear-gradient(135deg, #3b82f6, #6366f1); }
  .avatar.agent { background: linear-gradient(135deg, var(--accent-2), #a855f7); }

  .msg-body { flex: 1; min-width: 0; padding-top: 3px; }
  .msg-name { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.3px; }
  .msg-bubble {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 4px 14px 14px 14px;
    padding: 12px 15px;
    font-size: 13.8px;
    line-height: 1.65;
    overflow-wrap: break-word;
  }
  .msg.user .msg-bubble {
    background: var(--accent-soft);
    border-color: rgba(99,102,241,0.25);
    border-radius: 14px 14px 4px 14px;
  }
  .msg.user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user { justify-content: flex-end; }
  .msg.user .avatar { order: 2; margin-right: 0; margin-left: 11px; }
  .msg.user .msg-body { display: none; }
  .msg.user .msg-bubble { color: #d9deff; }

  /* Markdown-ish styling inside bubbles */
  .msg-bubble pre {
    background: #0a0d14;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 11px 13px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    margin: 9px 0;
  }
  .msg-bubble code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: rgba(99,102,241,0.12);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .msg-bubble pre code { background: none; padding: 0; }
  .msg-bubble p { margin: 6px 0; }
  .msg-bubble strong { color: #fff; }

  /* Tool call pill */
  .tool-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    margin: 3px 6px 3px 0;
    color: var(--text-muted);
    cursor: default;
  }
  .tool-pill .tk { color: var(--accent-2); font-weight: 700; font-size: 12px; }

  /* Thinking indicator */
  .thinking .msg-bubble { display: flex; align-items: center; gap: 8px; color: var(--text-muted); }
  .dots { display: inline-flex; gap: 3px; }
  .dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.1s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: 0.5; } 30% { transform: translateY(-3px); opacity: 1; } }

  /* Eval result */
  .eval-card {
    margin: 10px 0;
    border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
  }
  .eval-card .e-row { display: flex; justify-content: space-between; max-width: 340px; margin: 3px 0; }
  .eval-card .e-label { color: var(--text-muted); }
  .eval-card .e-feedback { margin-top: 7px; color: var(--text-muted); border-top: 1px dashed var(--border); padding-top: 7px; }

  /* Error */
  .msg.error .msg-bubble { border-color: rgba(248,113,113,0.35); color: var(--red); background: rgba(248,113,113,0.08); }

  /* Usage bar */
  .usage-bar {
    height: 30px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    font-size: 11.5px;
    color: var(--text-dim);
    background: var(--surface);
    flex-shrink: 0;
  }
  .usage-bar .u-right { display: flex; gap: 16px; }

  /* Input */
  .composer {
    padding: 14px 22px 18px;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    flex-shrink: 0;
  }
  .composer-box {
    max-width: 780px;
    margin: 0 auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .composer-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.8px;
    line-height: 1.5;
    max-height: 160px;
    min-height: 24px;
  }
  #input::placeholder { color: var(--text-dim); }
  .send-btn {
    width: 36px; height: 36px;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { filter: brightness(1.15); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }

  .hint {
    max-width: 780px; margin: 8px auto 0;
    font-size: 11px; color: var(--text-dim);
    text-align: center;
  }

  /* Empty state */
  .chat-empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    padding-bottom: 80px;
  }
  .chat-empty .big-logo {
    width: 62px; height: 62px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 8px 40px rgba(99,102,241,0.4);
    margin-bottom: 16px;
  }
  .chat-empty h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .chat-empty p { color: var(--text-muted); font-size: 13.5px; max-width: 360px; text-align: center; line-height: 1.6; }
  .chat-empty .suggestions { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  .suggestion {
    pointer-events: auto;
    font-size: 12px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .suggestion:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(6,8,12,0.7);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.18s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: min(760px, 92vw);
    max-height: 84vh;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-head {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 600;
  }
  .modal-close {
    margin-left: auto;
    background: none; border: none; color: var(--text-muted);
    font-size: 18px; cursor: pointer;
    padding: 2px 8px; border-radius: 6px;
  }
  .modal-close:hover { color: var(--text); background: var(--surface-2); }
  .modal-body { overflow: auto; padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
  .diff-line.add { color: var(--green); }
  .diff-line.del { color: var(--red); }
  .diff-line.hunk { color: var(--accent-2); }
  .diff-line.meta { color: var(--text-dim); }

  /* Responsive */
  @media (max-width: 860px) {
    aside { width: 60px; min-width: 60px; }
    aside .tab span.lbl { display: none; }
    .side-content { padding: 6px; }
    .folder-item, .session-item .s-title { font-size: 11px; }
    .session-item .s-meta { display: none; }
    .msg-name, .hint { display: none; }
  }
</style>
</head>
<body>

<!-- ── Header ─────────────────────────────── -->
<header>
  <div class="logo">
    <div class="logo-badge">⚡</div>
    Agentic IDE
  </div>
  <div class="status-pill">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">connecting…</span>
  </div>
  <div class="header-actions">
    <button class="btn" id="btnNew" title="Reset conversation">
      <span>✦</span> New Chat
    </button>
    <button class="btn" id="btnIndex" title="Index workspace for semantic search">
      <span class="btn-spin" id="indexSpin"></span><span>🔍</span> Index
    </button>
    <button class="btn" id="btnDiff" title="Show workspace diff">
      <span>⇄</span> Diff
    </button>
  </div>
</header>

<!-- ── Main ───────────────────────────────── -->
<div class="main">

  <!-- Sidebar -->
  <aside>
    <div class="tabs">
      <button class="tab active" data-tab="files"><span>📁</span><span class="lbl">Files</span></button>
      <button class="tab" data-tab="sessions"><span>💬</span><span class="lbl">Sessions</span></button>
    </div>
    <div class="side-content" id="sideContent">
      <div class="side-empty">Loading…</div>
    </div>
  </aside>

  <!-- Chat -->
  <section class="chat">
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="chat-empty" id="chatEmpty">
      <div class="big-logo">⚡</div>
      <h2>What shall we build?</h2>
      <p>Ask your coding agent to fix bugs, write features,
         or explore the workspace. It has real tools.</p>
      <div class="suggestions">
        <button class="suggestion">Fix a bug in this workspace</button>
        <button class="suggestion">Explain the project structure</button>
        <button class="suggestion">Write a new feature</button>
      </div>
    </div>

    <div class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Ask your agent something… (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="send-btn" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="hint">Agent has access to files, shell, RAG search &amp; git undo in the workspace</div>
    </div>

    <div class="usage-bar">
      <span id="usageLeft">tokens: —</span>
      <span class="u-right">
        <span id="usageCost">cost: —</span>
        <span id="usageCalls">calls: —</span>
        <span id="usageTools">tools: —</span>
      </span>
    </div>
  </section>
</div>

<!-- ── Diff Modal ─────────────────────────── -->
<div class="modal-overlay" id="diffOverlay">
  <div class="modal">
    <div class="modal-head">
      <span>⇄</span> Workspace Diff
      <button class="modal-close" onclick="closeModal('diffOverlay')">×</button>
    </div>
    <div class="modal-body" id="diffBody"></div>
  </div>
</div>

<!-- ── File Modal ─────────────────────────── -->
<div class="modal-overlay" id="fileOverlay">
  <div class="modal">
    <div class="modal-head" id="fileTitle">
      <span>📄</span> file
      <button class="modal-close" onclick="closeModal('fileOverlay')">×</button>
    </div>
    <div class="modal-body" id="fileBody"></div>
  </div>
</div>

<script>
"use strict";

// ── State ──────────────────────────────────
let ws = null;
let busy = false;
let thinkingEl = null;
let agentTextAccum = "";   // accumulate streaming text within a bubble
let agentBubble = null;

// ── DOM refs ───────────────────────────────
const chatEmpty = document.getElementById("chatEmpty");
const chatInner = document.getElementById("chatInner");
const chatScroll = document.getElementById("chatScroll");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");
const usageLeft = document.getElementById("usageLeft");
const usageCost = document.getElementById("usageCost");
const usageCalls = document.getElementById("usageCalls");
const usageTools = document.getElementById("usageTools");

// ── WebSocket connect ──────────────────────
function connectWS() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host + "/ws/chat");

  ws.onopen = () => { setStatus("ready", true); };

  ws.onclose = () => {
    setStatus("disconnected", false);
    setTimeout(() => { if (!busy) connectWS(); }, 2000);
  };

  ws.onerror = () => { setStatus("error", false); };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleServerMsg(msg);
  };
}

function setStatus(txt, ok) {
  statusText.textContent = txt;
  statusDot.style.background = ok
    ? "var(--green)"
    : txt === "error"
      ? "var(--red)"
      : "var(--yellow)";
}

// ── Server message handling ─────────────────
function handleServerMsg(msg) {
  switch (msg.type) {
    case "status":
      if (msg.data === "thinking") showThinking();
      else if (msg.data === "reset") {
        clearMessages(); setStatus("ready", true);
        chatEmpty.style.display = "flex";
      } else if (msg.data.startsWith("saved:")) {
        loadSessions();
      } else if (msg.data.startsWith("loaded:")) {
        setStatus("ready", true);
      }
      break;

    case "text":
      hideThinking();
      chatEmpty.style.display = "none";
      ensureAgentBubble();
      appendToBubble(msg.data);
      break;

    case "tool":
      hideThinking();
      chatEmpty.style.display = "none";
      ensureAgentBubble();
      addToolPill(msg.data.name, msg.data.args);
      usageTools.textContent = "tools: " + (++toolCount);
      break;

    case "eval":
      hideThinking();
      addEvalCard(msg.data);
      break;

    case "usage":
      renderUsage(msg.data);
      break;

    case "error":
      hideThinking();
      addErrorMessage(msg.data);
      setStatus("error", false);
      setBusy(false);
      break;

    case "done":
      hideThinking();
      setBusy(false);
      break;
  }
}

// ── Message rendering ───────────────────────
function addUserMessage(text) {
  chatEmpty.style.display = "none";
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `
    <div class="msg-body"><div class="msg-bubble"></div></div>
    <div class="avatar user">You</div>`;
  const bubble = div.querySelector(".msg-bubble");
  bubble.textContent = text;
  chatInner.appendChild(div);
  agentBubble = null;            // fresh turn
  agentTextAccum = "";
  scrollToBottom();
}

function ensureAgentBubble() {
  if (agentBubble) return;
  const div = document.createElement("div");
  div.className = "msg agent";
  div.innerHTML = `
    <div class="avatar agent">AI</div>
    <div class="msg-body">
      <div class="msg-name">AGENT</div>
      <div class="msg-bubble"></div>
    </div>`;
  chatInner.appendChild(div);
  agentBubble = div.querySelector(".msg-bubble");
  chatEmpty.style.display = "none";
  scrollToBottom();
}

function appendToBubble(text) {
  // We accumulate and lazily re-render to keep simple render() for code blocks
  agentTextAccum += text;
  agentBubble.innerHTML = renderMarkdown(agentTextAccum);
  scrollToBottom();
}

function addToolPill(name, args) {
  const pill = document.createElement("span");
  let argsStr = "";
  try { argsStr = JSON.stringify(args); } catch { argsStr = String(args); }
  if (argsStr.length > 60) argsStr = argsStr.slice(0, 60) + "…";
  pill.className = "tool-pill";
  pill.innerHTML = `<span class="tk">→</span> <span class="tn">${escapeHtml(name)}(${escapeHtml(argsStr)})</span>`;
  agentBubble.insertAdjacentElement("beforeend", pill);
  scrollToBottom();
}

function showThinking() {
  hideThinking();
  const div = document.createElement("div");
  div.className = "msg agent thinking";
  div.innerHTML = `
    <div class="avatar agent">AI</div>
    <div class="msg-body">
      <div class="msg-name">AGENT</div>
      <div class="msg-bubble"><span>thinking</span><span class="dots"><span></span><span></span><span></span></span></div>
    </div>`;
  chatInner.appendChild(div);
  thinkingEl = div;
  scrollToBottom();
}

function hideThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}

function addEvalCard(data) {
  if (!agentBubble) ensureAgentBubble();
  const card = document.createElement("div");
  card.className = "eval-card";
  const dims = ["faithfulness", "relevance", "completeness", "groundedness"];
  let rows = dims.map(d =>
    `<div class="e-row"><span class="e-label">${d}</span><span><b>${(data[d] || 0).toFixed(2)}</b></span></div>`
  ).join("");
  card.innerHTML = `
    <div class="e-row" style="font-weight:700"><span class="e-label">Overall</span>
      <span style="color:var(--accent-2)">${(data.overall_score || 0).toFixed(2)} · ${data.quality_level || ""}</span></div>
    ${rows}
    ${data.feedback ? `<div class="e-feedback">${escapeHtml(data.feedback)}</div>` : ""}`;
  agentBubble.appendChild(card);
  scrollToBottom();
}

function addErrorMessage(text) {
  const div = document.createElement("div");
  div.className = "msg agent error";
  div.innerHTML = `
    <div class="avatar agent">AI</div>
    <div class="msg-body">
      <div class="msg-name">ERROR</div>
      <div class="msg-bubble"></div>
    </div>`;
  div.querySelector(".msg-bubble").textContent = text;
  chatInner.appendChild(div);
  agentBubble = null;
  scrollToBottom();
}

function clearMessages() {
  chatInner.innerHTML = "";
  agentBubble = null;
  agentTextAccum = "";
  toolCount = 0;
}

function scrollToBottom() {
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

// ── Tiny markdown renderer ──────────────────
function renderMarkdown(text) {
  if (!text) return "";
  let html = escapeHtml(text);

  // fenced code blocks first
  const blocks = [];
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => {
    const idx = blocks.length;
    blocks.push(`<pre><code>${code}</code></pre>`);
    return `\u0000CODE${idx}\u0000`;
  });

  html = html.replace(/^### (.*)$/gm, "<h4>$1</h4>")
             .replace(/^## (.*)$/gm, "<h4>$1</h4>")
             .replace(/^# (.*)$/gm, "<h4>$1</h4>")
             .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
             .replace(/`([^`\n]+)`/g, "<code>$1</code>")
             .replace(/^\s*[-*] (.*)$/gm, "<p>• $1</p>")
             .replace(/^\s*\d+\. (.*)$/gm, "<p>$1</p>")
             .replace(/\n{2,}/g, "</p><p>")
             .replace(/\n/g, "<br>");

  html = `<p>${html}</p>`;

  html = html.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => blocks[+i]);
  return html;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── Usage ───────────────────────────────────
let toolCount = 0;
function renderUsage(u) {
  const tokens = (u && u.total_tokens) || 0;
  const cost = (u && u.cost_usd) || 0;
  const calls = (u && u.total_calls) || 0;
  const tools = (u && u.tool_calls) || 0;
  usageLeft.textContent = "tokens: " + tokens.toLocaleString() + " (~" + Math.round((u && u.duration_sec) || 0) + "s)";
  usageCost.textContent = "cost: $" + cost.toFixed(4);
  usageCalls.textContent = "calls: " + calls;
  usageTools.textContent = "tools: " + tools;
}

// ── Composer / controls ─────────────────────
function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  inputEl.disabled = v;
  if (!v) inputEl.focus();
}

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy || !ws || ws.readyState !== 1) return;
  inputEl.value = "";
  autoGrow();
  setBusy(true);
  addUserMessage(text);
  ws.send(JSON.stringify({ type: "chat", message: text }));
}

function autoGrow() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener("input", autoGrow);

document.getElementById("btnNew").addEventListener("click", () => {
  if (busy) return;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "reset" }));
  clearMessages();
  chatEmpty.style.display = "flex";
  usageLeft.textContent = "tokens: —";
  usageCost.textContent = "cost: —";
  usageCalls.textContent = "calls: —";
  usageTools.textContent = "tools: —";
});

document.getElementById("btnIndex").addEventListener("click", async () => {
  const btn = document.getElementById("btnIndex");
  const spin = document.getElementById("indexSpin");
  btn.disabled = true;
  spin.style.display = "inline-block";
  try {
    const res = await fetch("/api/index", { method: "POST" });
    const data = await res.json();
    if (data.error) { setStatus("index failed", false); }
    else { statusText.textContent = `indexed: ${data.count} chunks`; statusDot.style.background = "var(--green)"; }
  } catch {
    setStatus("index failed", false);
  } finally {
    btn.disabled = false;
    spin.style.display = "none";
  }
});

// ── Diff modal ──────────────────────────────
document.getElementById("btnDiff").addEventListener("click", async () => {
  try {
    const res = await fetch("/api/diff");
    const data = await res.json();
    renderDiff(data.diff || "(No changes)");
    openModal("diffOverlay");
  } catch { setStatus("diff error", false); }
});

function renderDiff(text) {
  const body = document.getElementById("diffBody");
  body.innerHTML = "";
  text.split("\n").forEach(line => {
    const div = document.createElement("div");
    let cls = "";
    if (/^\+\+\+/.test(line) || /^---/.test(line) || /^diff/.test(line) || /^index/.test(line)) cls = "meta";
    else if (/^@@/.test(line)) cls = "hunk";
    else if (line.startsWith("+")) cls = "add";
    else if (line.startsWith("-")) cls = "del";
    div.className = "diff-line " + cls;
    div.textContent = line || " ";
    body.appendChild(div);
  });
}

// ── Modal helpers ───────────────────────────
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
document.querySelectorAll(".modal-overlay").forEach(ov => {
  ov.addEventListener("click", (e) => { if (e.target === ov) ov.classList.remove("open"); });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.querySelectorAll(".modal-overlay").forEach(ov => ov.classList.remove("open"));
});

// ── Sidebar: tabs ───────────────────────────
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    if (tab.dataset.tab === "files") loadFiles();
    else loadSessions();
  });
});

// ── Sidebar: files ──────────────────────────
function loadFiles() {
  const container = document.getElementById("sideContent");
  container.innerHTML = '<div class="side-empty">Loading files…</div>';
  fetch("/api/files").then(r => r.json()).then(data => {
    if (!data.tree || !data.tree.length) {
      container.innerHTML = '<div class="side-empty">Workspace is empty</div>';
      return;
    }
    container.innerHTML = "";
    container.appendChild(renderFileNodes(data.tree));
  }).catch(() => {
    container.innerHTML = '<div class="side-empty">Failed to load files</div>';
  });
}

function renderFileNodes(nodes) {
  const folder = document.createElement("div");
  folder.className = "folder";
  nodes.forEach(node => renderFileNode(node, folder));
  return folder;
}

function renderFileNode(node, parent) {
  const item = document.createElement("div");
  item.className = "folder-item" + (node.type === "dir" ? " is-dir" : "");
  const icon = node.type === "dir" ? "📁" : "📄";
  item.textContent = `${icon} ${node.name}`;
  if (node.type === "dir") {
    item.addEventListener("click", (e) => {
      e.stopPropagation();
      const children = item.nextElementSibling;
      if (children) {
        children.style.display = children.style.display === "none" ? "" : "none";
      }
    });
    parent.appendChild(item);
    const kids = document.createElement("div");
    kids.className = "children";
    kids.style.display = "none";
    (node.children || []).forEach(c => renderFileNode(c, kids));
    parent.appendChild(kids);
  } else {
    item.addEventListener("click", () => openFile(node.path));
    parent.appendChild(item);
  }
}

async function openFile(path) {
  try {
    const res = await fetch("/api/files/read?path=" + encodeURIComponent(path));
    const data = await res.json();
    if (data.error) { setStatus("read error", false); return; }
    document.getElementById("fileTitle").innerHTML =
      `<span>📄</span> ${escapeHtml(path)}<button class="modal-close" onclick="closeModal('fileOverlay')">×</button>`;
    const body = document.getElementById("fileBody");
    body.innerHTML = `<pre style="margin:0;white-space:pre-wrap;word-break:break-word">${escapeHtml(data.content)}</pre>`;
    openModal("fileOverlay");
  } catch { setStatus("read error", false); }
}

// ── Sidebar: sessions ───────────────────────
function loadSessions() {
  const container = document.getElementById("sideContent");
  container.innerHTML = '<div class="side-empty">Loading…</div>';
  fetch("/api/sessions").then(r => r.json()).then(data => {
    const list = data.sessions || [];
    if (!list.length) {
      container.innerHTML = '<div class="side-empty">No saved sessions yet.</div>';
      return;
    }
    container.innerHTML = "";
    list.forEach(s => {
      const item = document.createElement("div");
      item.className = "session-item";
      item.innerHTML = `
        <div class="s-title">${escapeHtml(s.title || "(untitled)")}</div>
        <div class="s-meta">${escapeHtml(s.session_id)} · ${s.turn_count || 0} turns · ${(s.updated_at || "").slice(0, 10)}</div>`;
      item.addEventListener("click", () => {
        if (busy) return;
        item.classList.add("session-loading");
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "load_session", session_id: s.session_id }));
        }
        statusText.textContent = "loading: " + s.session_id;
        statusDot.style.background = "var(--yellow)";
      });
      container.appendChild(item);
    });
  }).catch(() => {
    container.innerHTML = '<div class="side-empty">Failed to load sessions</div>';
  });
}

// ── Suggestions ─────────────────────────────
document.querySelectorAll(".suggestion").forEach(s => {
  s.addEventListener("click", () => {
    inputEl.value = s.textContent;
    inputEl.focus();
  });
});

// ── Init ────────────────────────────────────
connectWS();
loadFiles();
</script>
</body>
</html>
